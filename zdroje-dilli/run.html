<!doctype html><html><head><meta charset="utf-8"><title>Delhi timelapse</title>
<link rel="stylesheet" href="fonts/fonts.css">
<script src="lib/mp4-muxer.js"></script>
<style>body{margin:0;background:#111;color:#ddd;font:14px sans-serif}canvas{width:100%;max-width:1280px;display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas><div id="status"></div>
<script src="core.js?v=11"></script><script src="world.js?v=11"></script><script src="spr.js?v=11"></script><script src="build.js?v=11"></script><script src="agents.js?v=11"></script><script src="show.js?v=11"></script>
<script>
const main = document.getElementById('c'), mg = main.getContext('2d');
const c2 = document.createElement('canvas'); c2.width = W; c2.height = H; const g2 = c2.getContext('2d');
window.INIT = (async () => {
  S('fonts…'); for (const f of ['700 40px Cinzel', '400 40px UnifrakturMaguntia', '600 40px "EB Garamond"', '700 40px "Bodoni Moda"', '500 40px Inter', '600 40px Inter', '700 40px Inter', '800 40px Inter']) { try { await document.fonts.load(f); } catch (e) {} }
  S('data…'); await loadData(); S('albedo…'); const alb = buildAlbedo(); S('urban…'); const uy = buildUrban(); await loadRoads(); S('gl…'); glSetup(alb, uy);
  S('buildings…'); const n = genBuildings(); addWalls(); compileTimeline(); buildAgents(); buildActs(); S('ready ' + n + ' items, ' + TLN.total.toFixed(1) + ' s'); window.READY = true;
})().catch(e => { S('ERR ' + e.message + ' ' + (e.stack || '').split('\n')[1]); console.error(e); });
function renderFrame(t) {
  const S0 = stateAt(t), sg = S0.sg; { const S1 = stateAt(Math.min(t + 0.2, TLN.total - 1e-3)); S0.agA = 1 - clamp((Math.abs(S1.year - S0.year) / 0.2 - 12) / 28); }
  if (sg.k === 'split' || sg.k === 'end') {
    const H0 = HOOKCAM(), today = Object.assign({}, S0, { year: 2025, night: 1, flood: -1 }), old = Object.assign({}, S0, { year: 1947.62, night: 0.25, flood: -1 });
    renderWorld(g2, today, t); renderWorld(mg, old, t); const x = Math.round(W * S0.wipe); if (x > 0) { mg.save(); mg.beginPath(); mg.rect(0, 0, x, H); mg.clip(); mg.drawImage(c2, 0, 0); mg.restore(); if (x < W) { mg.fillStyle = 'rgba(255,230,160,0.9)'; mg.fillRect(x - 3, 0, 6, H); } }
  } else renderWorld(mg, S0, t);
  mg.filter = 'saturate(1.3) contrast(1.04)'; mg.drawImage(main, 0, 0); mg.filter = 'none';
  drawHUD(mg, S0); return S0;
}
window.renderFrame = renderFrame;
window.exportTimeline = async () => {
  const raid = ACTS.find(a => a.raid), plan = raid ? raidPlan(raid) : [];
  const out = { total: TLN.total, segs: TLN.segs.map(s => ({ k: s.k, t0: s.t0, t1: s.t1, i: s.i })), events: EVENTS.map(E => ({ y: E.y, t: E.t, key: !!E.key, t0: E.t0, t1: E.t1, fx: E.fx || null, age: E.age || null, night: E.night || 0 })),
    acts: ACTS.map(a => ({ name: a.name, t0: a.t0, t1: a.t1, n: a.units.length, snd: a.snd || [], shells: a.shells ? { t0: a.shells.t0, gap: a.shells.gap, n: a.shells.n } : null, jets: a.jets ? a.jets.t0 : null, balloon: a.balloon ? a.balloon.t0 : null })),
    flights: FLIGHTS.map(f => ({ t0: f.t0, t1: f.t1, type: f.type, dir: f.dir })),
    raidPlanes: plan.map(b => ({ t0: b.t0, dur: b.dur })), raidBombs: plan.flatMap(b => b.bombs.map(bb => { const t = b.t0 + bb.u * b.dur; const x = bomberPos(b, bb.u)[0]; return { drop: t, hit: t + bb.fall, pan: clamp((x + 120) / W * 2 - 1, -0.9, 0.9) }; })) };
  const r = await fetch('/save/timeline_dl.json', { method: 'PUT', body: JSON.stringify(out) }); return r.status; };
window.startEncode = async (opts = {}) => {
  // H.264 (avc) where the browser can encode it (Chrome/Safari desktop); otherwise VP9 in MP4 (re-encode with ffmpeg afterwards).
  const FPS = 30, total = Math.round(TLN.total * FPS), from = opts.from || 0, to = Math.min(total, opts.to || total);
  const avcOk = !opts.vp9 && (await VideoEncoder.isConfigSupported({ codec: 'avc1.640032', width: W, height: H, bitrate: 12e6, framerate: FPS })).supported;
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: avcOk ? 'avc' : 'vp9', width: W, height: H }, fastStart: 'in-memory' });
  const enc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => S('encoder error: ' + e.message) });
  enc.configure(avcOk ? { codec: 'avc1.640032', width: W, height: H, bitrate: 12e6, framerate: FPS } : { codec: 'vp09.00.40.08', width: W, height: H, bitrate: opts.bitrate || 9e6, framerate: FPS, latencyMode: 'realtime' });
  const t0 = performance.now();
  for (let f = from; f < to; f++) {
    renderFrame(f / FPS); const vf = new VideoFrame(main, { timestamp: Math.round((f - from) * 1e6 / FPS), duration: Math.round(1e6 / FPS) }); enc.encode(vf, { keyFrame: (f - from) % 60 === 0 }); vf.close();
    while (enc.encodeQueueSize > 8) await yieldUI(); if (f % 15 === 0) { S(`encoding frame ${f}/${total} (${Math.round(f / total * 100)} %) – ${Math.round((performance.now() - t0) / 1000)} s`); await yieldUI(); }
  }
  await enc.flush(); muxer.finalize(); const buf = muxer.target.buffer; S('uploading ' + Math.round(buf.byteLength / 1e6) + ' MB…');
  const name = opts.name || (avcOk ? 'delhi-silent.mp4' : 'delhi-silent-vp9.mp4'), r = await fetch('/save/' + name, { method: 'PUT', body: buf }); S('DONE ' + r.status + ' – ' + name + ' ' + Math.round(buf.byteLength / 1e6) + ' MB, frames ' + from + '-' + to + ' of ' + total); window.DONE = true;
};
</script></body></html>
